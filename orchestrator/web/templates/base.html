<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Assessment Orchestrator{% endblock %}</title>
<style>
:root { color-scheme: light dark; --bg:#f4f6f8; --card:#fff; --ink:#1a1d21; --muted:#69727d;
        --line:#e2e6ea; --accent:#2d6cb3; --ok:#2e7d32; --warn:#c77700; --err:#b4232a; }
@media (prefers-color-scheme: dark){ :root{ --bg:#12151a; --card:#1c2127; --ink:#e7eaee;
        --muted:#97a1ac; --line:#2a3037; --accent:#5b9bd8; } }
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;
  display:flex;align-items:center;gap:12px}
header h1{font-size:16px;margin:0} header .tag{font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:12px;padding:2px 8px}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
h2{font-size:16px;margin:22px 0 8px} h3{font-size:13px;margin:16px 0 6px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse} td,th{text-align:left;padding:7px 9px;
  border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
code{background:rgba(127,127,127,.14);padding:1px 5px;border-radius:4px;font-size:12.5px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:7px;
  padding:8px 14px;font-size:14px;cursor:pointer}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.muted{color:var(--muted)} .pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px}
.pill.yes{background:rgba(46,125,50,.15);color:var(--ok)} .pill.no{background:rgba(180,35,42,.15);color:var(--err)}
.flash{padding:10px 14px;border-radius:8px;margin:10px 0;font-size:13.5px}
.flash.ok{background:rgba(46,125,50,.12);color:var(--ok)} .flash.error{background:rgba(180,35,42,.12);color:var(--err)}
label{display:block;font-size:13px;margin:10px 0 4px} select{width:100%;padding:8px;border-radius:7px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.check{display:flex;gap:8px;align-items:flex-start;margin:12px 0;font-size:13px}
.sev{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;color:#fff}
.sev.critical{background:#7c1d1d}.sev.high{background:#b4232a}.sev.medium{background:#c77700}
.sev.low{background:#2d6cb3}.sev.info{background:#5b6470}
.s-ok{color:var(--ok)}.s-skipped{color:var(--warn)}.s-error{color:var(--err)}.s-running{color:var(--accent)}
.vbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;color:#fff}
.vbadge.v-ok{background:var(--ok)}.vbadge.v-mut{background:#5b6470}.vbadge.v-err{background:var(--err)}
.banner{background:rgba(199,119,0,.1);border:1px solid rgba(199,119,0,.35);border-radius:8px;
  padding:10px 14px;font-size:12.5px;margin:14px 0}
</style>
{% block head %}{% endblock %}
</head><body>
<header>
  <h1>🛡️ Assessment Orchestrator</h1>
  <span class="tag">authorized engagements only</span>
  <span style="flex:1"></span>
  <a href="{{ url_for('index') }}">Home</a>
</header>
<div class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
</body></html>
